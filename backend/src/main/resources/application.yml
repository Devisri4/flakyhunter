spring:
  application:
    name: FlakyHunter
  threads:
    virtual:
      enabled: true
  # Values come from environment variables (see .env.example) — never hard-code them here.
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches

server:
  # Render tells the app which port to use through $PORT
  port: ${PORT:8080}
  # Behind Vercel/Render proxies: trust X-Forwarded-* so the app knows requests were HTTPS.
  # The client IP from X-Forwarded-For can be faked, so security limits never rely on the IP alone.
  forward-headers-strategy: framework

flakyhunter:
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    secure-cookies: true
  ingestion:
    poll-interval: 2s
    batch-size: 3
    max-attempts: 3
    stuck-after: 5m
    max-files: 20
  rate-limits:
    login-per-minute: 10
    login-per-email-per15-minutes: 30
    signup-per-hour: 20
    ingest-per-minute: 30
  demo:
    # the public read-only demo project at /p/demo (generated on startup, topped up daily)
    enabled: ${DEMO_MODE:true}

# /api/actuator/info: build version/time, plus the deployed commit (Render sets RENDER_GIT_COMMIT)
info:
  deploy:
    commit: ${RENDER_GIT_COMMIT:local}

# Everything the browser calls lives under /api, so the Vercel /api/* rewrite covers it.
management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health, info
  endpoint:
    health:
      show-components: always
  info:
    env:
      enabled: true
