name: junit5-extension

on:
  push:
    branches: [main]
    paths: ['junit5-extension/**', '.github/workflows/junit5-extension.yml']
  pull_request:
    paths: ['junit5-extension/**', '.github/workflows/junit5-extension.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: junit5-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # the oldest Java the library supports
          cache: maven
      - run: mvn -B verify
